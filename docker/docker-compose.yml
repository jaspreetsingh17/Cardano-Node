version: '3.8'

services:
  cardano-node:
    image: inputoutput/cardano-node:8.7.3
    container_name: cardano-node
    restart: unless-stopped
    ports:
      - "3001:3001"
      - "12798:12798"
    volumes:
      - cardano-db:/data/db
      - cardano-ipc:/ipc
      - ./config:/config:ro
    environment:
      - NETWORK=mainnet
    command:
      - run
      - --topology
      - /config/mainnet-topology.json
      - --database-path
      - /data/db
      - --socket-path
      - /ipc/node.socket
      - --host-addr
      - 0.0.0.0
      - --port
      - "3001"
      - --config
      - /config/mainnet-config.json
    healthcheck:
      test: ["CMD", "cardano-cli", "query", "tip", "--mainnet", "--socket-path", "/ipc/node.socket"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "10"
    networks:
      - cardano-network

  cardano-db-sync:
    image: inputoutput/cardano-db-sync:13.1.1.3
    container_name: cardano-db-sync
    restart: unless-stopped
    depends_on:
      - cardano-node
      - postgres
    volumes:
      - cardano-ipc:/node-ipc:ro
      - db-sync-state:/var/lib/cexplorer
      - ./config:/config:ro
    environment:
      - NETWORK=mainnet
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=cardano
      - POSTGRES_USER=cardano
      - POSTGRES_PASSWORD=cardano_password
    networks:
      - cardano-network

  postgres:
    image: postgres:15
    container_name: cardano-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=cardano
      - POSTGRES_USER=cardano
      - POSTGRES_PASSWORD=cardano_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cardano-network

volumes:
  cardano-db:
  cardano-ipc:
  db-sync-state:
  postgres-data:

networks:
  cardano-network:
    driver: bridge
